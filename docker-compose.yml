version: '3.9'
services:
  backend:
    build:
      context: ./backend/application-source
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./backend/application-source:/app
    env_file:
      - .env
    depends_on:
      - redis
    command: python manage.py runserver 0.0.0.0:8000

  celery:
    build:
      context: ./backend/application-source
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A project_configuration worker --loglevel=info

  celery-beat:
    build:
      context: ./backend/application-source
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A project_configuration beat --loglevel=info

  frontend:
    build:
      context: ./frontend/applications/member-portal
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./frontend/applications/member-portal:/app
      - /app/node_modules
    env_file:
      - .env
    command: npm run dev

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
