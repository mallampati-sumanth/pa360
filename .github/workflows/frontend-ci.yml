name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

jobs:
  lint-type-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/applications/member-portal/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend/applications/member-portal
          npm ci
      - name: Lint
        run: |
          cd frontend/applications/member-portal
          npm run lint
      - name: Type check
        run: |
          cd frontend/applications/member-portal
          npm run type-check
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: |
          cd frontend/applications/member-portal
          npm run build
